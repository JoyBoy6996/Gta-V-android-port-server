services:
  - type: web
    name: gta-v-android-port-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn gwsc_local_termux.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GWSC_SERVER_NAME
        value: Gooneral Wheelchair Social Club
      - key: GWSC_REGISTRATION
        value: "true"
